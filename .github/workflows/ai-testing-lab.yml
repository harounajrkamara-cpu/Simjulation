name: AI Testing Lab

on:
  push:
    branches:
      - ai-lab/testing-council
  pull_request:
    branches:
      - ai-lab/testing-council
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ai-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    name: Active game checks and adversarial poisoning probes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out testing lab
        uses: actions/checkout@v4

      - name: Check out active game-development branch into isolated target folder
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: build/stage-1
          path: target

      - name: Record exact game commit under test
        id: target
        run: |
          echo "sha=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=build/stage-1" >> "$GITHUB_OUTPUT"
          git -C target log -1 --oneline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install locked dependencies
        id: install
        working-directory: target
        run: npm ci

      - name: Run official test suite
        id: suite
        continue-on-error: true
        working-directory: target
        run: npm test

      - name: Check TypeScript
        id: types
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run typecheck

      - name: Build browser version
        id: webbuild
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run build:web

      - name: Run deterministic balance simulation
        id: balance
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run balance

      - name: Inject isolated adversarial tests (never committed to game source)
        if: always() && steps.install.outcome == 'success'
        run: cp reports/reviews/poisoning-scenarios-2026-10-15.test.ts target/tests/round2-poisoning.test.ts

      - name: Probe poisoning / NPC death scenarios against the exact target source
        id: poisoning
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        shell: bash
        run: |
          set +e
          npx vitest run tests/round2-poisoning.test.ts --reporter=verbose 2>&1 | tee "$RUNNER_TEMP/poisoning-test.log"
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish exact runtime evidence to issue #6
        if: always()
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
          TYPES_OUTCOME: ${{ steps.types.outcome }}
          WEBBUILD_OUTCOME: ${{ steps.webbuild.outcome }}
          BALANCE_OUTCOME: ${{ steps.balance.outcome }}
          POISONING_OUTCOME: ${{ steps.poisoning.outcome }}
          POISONING_EXIT: ${{ steps.poisoning.outputs.exit_code }}
          LOG_PATH: ${{ runner.temp }}/poisoning-test.log
        with:
          script: |
            const fs = require('fs');
            const logPath = process.env.LOG_PATH;
            let log = '';
            try { log = fs.readFileSync(logPath, 'utf8'); } catch { log = '(No adversarial test log was produced; dependency installation or an earlier step may have failed.)'; }
            const checks = [
              ['npm ci', process.env.INSTALL_OUTCOME],
              ['npm test', process.env.SUITE_OUTCOME],
              ['npm run typecheck', process.env.TYPES_OUTCOME],
              ['npm run build:web', process.env.WEBBUILD_OUTCOME],
              ['npm run balance', process.env.BALANCE_OUTCOME],
              ['poisoning scenarios', process.env.POISONING_OUTCOME + ' (exit ' + (process.env.POISONING_EXIT || 'not run') + ')'],
            ].map(([name, result]) => '- ' + name + ': ' + (result || 'not run')).join('\n');
            const body = '## Automated round-two QA — poisoning / NPC death\n\n' +
              '**Exact target:** `' + (process.env.TARGET_BRANCH || 'build/stage-1') + '` at `' + (process.env.TARGET_SHA || 'SHA unavailable') + '`.\n\n' +
              '**Observed command outcomes:**\n' + checks + '\n\n' +
              '**Targeted Vitest output (runtime evidence):**\n```text\n' + log.slice(-12000) + '\n```\n\n' +
              'The adversarial test file was copied into the Actions checkout only; it was not committed to `build/stage-1`. These checks use a fake AI adapter and no paid model calls. A failing expected-safety assertion is evidence the corresponding exploit reproduced; check each test name and assertion rather than interpreting the adversarial probe step status as a failure of the existing baseline suite.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body
            });
            await core.summary.addRaw(body).write();
